    <script>
      // Polyfill window.fetch setter to allow browser extensions and interceptors to safely patch it
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch ? originalFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch || originalFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            }
          });
        } catch (e) {
          try {
            window.fetch = window.fetch;
          } catch (err) {}
        }

        // Suppress browser extension runtime errors from bubbling to app error handlers
        window.addEventListener('error', function(e) {
          if (e && e.message && (
            e.message.indexOf('Cannot set property fetch') !== -1 ||
            e.message.indexOf('chrome-extension://') !== -1
          )) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
